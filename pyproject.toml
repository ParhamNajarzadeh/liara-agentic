[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liara-agentic-sre"
version = "1.0.0"
description = "Self-Contained Multi-Agent PaaS Deployment & SRE Assistant for Liara (StarCoach Hackathon)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Principal Agentic AI & Staff SRE Team"}
]
# 100% Self-Contained Public PyPI Dependencies (Zero external git repo links!)
dependencies = [
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.26.0",
]

[project.optional-dependencies]
langgraph = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
